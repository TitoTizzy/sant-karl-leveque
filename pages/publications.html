<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Centre de documentation de Sant Karl Lévêque : rapports et publications.">
    <title>Actualités et publications - Sant Karl Lévêque</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/app.js?v=20260928-accents" defer></script>
  </head>
  <body data-page="docs" data-section="publications" data-base="../">
    <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
    <header class="site-header" data-site-header></header>
    <main id="main">
      <section class="page-hero">
        <p class="eyebrow" data-i18n="docsEyebrow">Centre de documentation</p>
        <h1 data-i18n="docsTitle">Rapports, notes de plaidoyer et ressources institutionnelles.</h1>
        <p data-i18n="docsLead">Un espace filtrable pour consulter et télécharger les documents officiels de SKL.</p>
      </section>
      <section class="section">
        <div class="doc-toolbar">
          <label><span data-i18n="searchDocs">Rechercher</span><input type="search" id="doc-search" placeholder="SKL, droits humains, mission"></label>
          <div class="filters" role="group" aria-label="Filtrer les documents">
            <button class="filter-button is-active" type="button" data-doc-filter="all" data-i18n="filterAll">Tout</button>
            <button class="filter-button" type="button" data-doc-filter="institutional" data-i18n="filterInstitutional">Institutionnel</button>
            <button class="filter-button" type="button" data-doc-filter="advocacy" data-i18n="filterAdvocacy">Plaidoyer</button>
            <button class="filter-button" type="button" data-doc-filter="report" data-i18n="filterReports">Rapports</button>
          </div>
        </div>
        <div class="document-list" data-render="documents"></div>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
